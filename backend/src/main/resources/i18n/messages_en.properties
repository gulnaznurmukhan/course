mail.verify.subject=ClientFlow: confirm your email
mail.verify.body=Hello, {0}!\n\nTo finish signing up for ClientFlow, open this link:\n{1}\n\nThe link is valid for {2} hours and can be used only once.\nIf you did not sign up, simply ignore this email.

mail.reset.subject=ClientFlow: password reset
mail.reset.body=Hello, {0}!\n\nTo set a new password, open this link:\n{1}\n\nThe link is valid for {2} minutes and can be used only once.\nIf you did not request a password reset, ignore this email and your password will stay the same.

mail.exists.subject=ClientFlow: sign-up attempt
mail.exists.body=Hello, {0}!\n\nSomeone tried to sign up for ClientFlow with your email, but an account already exists.\n\nSign in: {1}\nForgot your password? {2}\n\nIf this was not you, no action is needed.

mail.invite.subject=ClientFlow: workspace invitation
mail.invite.body={0} invited you to the workspace "{1}" in ClientFlow.\n\nIf you already have an account with this email, just sign in: {2}\nIf not, sign up with this email and you will get access after confirming it: {3}
