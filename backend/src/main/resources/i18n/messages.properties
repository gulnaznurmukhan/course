# Russian is the default language. In MessageFormat a single quote must be written as ''.
mail.verify.subject=ClientFlow: подтвердите email
mail.verify.body=Здравствуйте, {0}!\n\nЧтобы завершить регистрацию в ClientFlow, перейдите по ссылке:\n{1}\n\nСсылка действует {2} ч. и может быть использована один раз.\nЕсли вы не регистрировались, просто проигнорируйте это письмо.

mail.reset.subject=ClientFlow: восстановление пароля
mail.reset.body=Здравствуйте, {0}!\n\nЧтобы задать новый пароль, перейдите по ссылке:\n{1}\n\nСсылка действует {2} мин. и может быть использована один раз.\nЕсли вы не запрашивали смену пароля, проигнорируйте это письмо — ваш пароль не изменится.

mail.exists.subject=ClientFlow: попытка регистрации
mail.exists.body=Здравствуйте, {0}!\n\nКто-то попытался зарегистрироваться в ClientFlow с вашим email, но аккаунт уже существует.\n\nВойти: {1}\nЗабыли пароль? {2}\n\nЕсли это были не вы, ничего делать не нужно.

mail.invite.subject=ClientFlow: приглашение в рабочее пространство
mail.invite.body={0} приглашает вас в рабочее пространство «{1}» в ClientFlow.\n\nЕсли у вас уже есть аккаунт с этим email, просто войдите: {2}\nЕсли нет — зарегистрируйтесь с этим email, и доступ появится после подтверждения почты: {3}
