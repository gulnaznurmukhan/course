mail.verify.subject=ClientFlow: email-ді растаңыз
mail.verify.body=Сәлеметсіз бе, {0}!\n\nClientFlow жүйесінде тіркелуді аяқтау үшін сілтемеге өтіңіз:\n{1}\n\nСілтеме {2} сағат жарамды және бір рет қана қолданылады.\nЕгер сіз тіркелмеген болсаңыз, бұл хатты елемеңіз.

mail.reset.subject=ClientFlow: құпиясөзді қалпына келтіру
mail.reset.body=Сәлеметсіз бе, {0}!\n\nЖаңа құпиясөз орнату үшін сілтемеге өтіңіз:\n{1}\n\nСілтеме {2} минут жарамды және бір рет қана қолданылады.\nЕгер сіз құпиясөзді өзгертуді сұрамаған болсаңыз, бұл хатты елемеңіз — құпиясөзіңіз өзгермейді.

mail.exists.subject=ClientFlow: тіркелу әрекеті
mail.exists.body=Сәлеметсіз бе, {0}!\n\nБіреу сіздің email арқылы ClientFlow жүйесіне тіркелуге тырысты, бірақ аккаунт бұрыннан бар.\n\nКіру: {1}\nҚұпиясөзді ұмыттыңыз ба? {2}\n\nЕгер бұл сіз болмасаңыз, ештеңе істеудің қажеті жоқ.

mail.invite.subject=ClientFlow: жұмыс кеңістігіне шақыру
mail.invite.body={0} сізді ClientFlow жүйесіндегі «{1}» жұмыс кеңістігіне шақырады.\n\nЕгер осы email-мен аккаунтыңыз бар болса, жай ғана кіріңіз: {2}\nЕгер жоқ болса — осы email-мен тіркеліңіз, пошта расталғаннан кейін қолжетімділік пайда болады: {3}
