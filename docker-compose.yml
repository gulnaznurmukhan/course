# Local development environment for ClientFlow.
#
#   docker compose up -d db mailpit      # only infrastructure (run apps from IDE / npm)
#   docker compose up -d --build         # everything, app at http://localhost:3000
#
# Values here are for local development only. Production secrets are configured
# in the hosting provider's environment settings, never in this file.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clientflow
      POSTGRES_USER: clientflow
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-clientflow}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientflow -d clientflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Development-only email inbox: open http://localhost:8025 to read
  # verification and password reset emails. Nothing is delivered externally.
  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/clientflow
      DB_USERNAME: clientflow
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-clientflow}
      # Mailpit by default; fill the SMTP_* lines in .env to send real mail through Gmail
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-ClientFlow <no-reply@clientflow.local>}
      APP_PUBLIC_URL: http://localhost:3000
      # Same origin through nginx, so CORS is not needed
      CORS_ALLOWED_ORIGINS: ""
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  db-data:
